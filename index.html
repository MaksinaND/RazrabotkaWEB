<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ЛР8 — Анализ текста</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!--
        Лабораторная работа № А-8
        Тема: Основы работы со строковыми данными в PHP. Кодировка. Анализ текста.

        Этот файл по требованию лабораторной является статическим HTML-документом.
        Здесь нет PHP-кода: только форма для ввода многострочного текста.
        После нажатия кнопки данные отправляются в файл result.php.
    -->

    <div class="container">
        <h1>Лабораторная работа № А-8</h1>
        <h2>Анализ текста</h2>

        <p class="hint">
            Введите русский или английский текст. После нажатия кнопки программа посчитает
            символы, буквы, цифры, знаки препинания, слова и частоту повторений.
        </p>

        <!--
            Форма отправляет данные методом POST.
            action="result.php" означает, что обработка будет происходить во втором файле.
        -->
        <form action="result.php" method="post">

            <!--
                Многострочное поле textarea — основной элемент формы.
                Его имя name="data" используется в PHP как $_POST['data'].
            -->
            <label for="data">Текст для анализа:</label>
            <textarea id="data" name="data" rows="12" placeholder="Например: Привет, мир! Hello, world! 123"></textarea>

            <!-- Кнопка отправляет форму на анализ -->
            <input type="submit" value="Анализировать">
        </form>
    </div>

</body>
</html>
